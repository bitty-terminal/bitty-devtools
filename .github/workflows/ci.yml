name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Quality gates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install just
        uses: taiki-e/install-action@94c31af3204a9f15ab40b35ad084410b905bbc73 # v2
        with:
          tool: just@1.58.0
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2
      - name: Install locked project dependencies
        run: bun install --frozen-lockfile
      - name: Run quality gates
        run: just check

  actionlint:
    name: Lint GitHub Actions workflows
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Lint workflows with pinned actionlint
        uses: docker://rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
        with:
          args: -color

  platform:
    name: Offline platform contract (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2
      - name: Install locked project dependencies
        run: bun install --frozen-lockfile
      - name: Run offline platform contract tests
        run: bun test tests/platform-contract.test.ts
      - name: Exercise executable help without a target
        run: bun run bin/bitty-devtools.ts --help

  fuzz-smoke:
    name: Fuzz smoke (pinned, read-only, offline)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    env:
      RUST_TEST_THREADS: "1"
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2
      - name: Set up Rust 1.98.1
        run: rustup toolchain install 1.98.1 --profile minimal --no-self-update
      - name: Reject seed mirror drift
        run: diff -r tests/fixtures/fuzz/framer-seeds crates/devtools-client/tests/fixtures/fuzz/framer-seeds
      - name: TypeScript fuzz smoke (no install)
        run: bun test tests/framer-fuzz-smoke.test.ts
      - name: Fetch locked Rust dependencies (setup only)
        run: cargo fetch --locked
      - name: Rust fuzz smoke (locked, offline, single-threaded)
        env:
          CARGO_NET_OFFLINE: "true"
        run: cargo test -p bitty-devtools-client --test framer_fuzz_smoke --locked --offline -- --test-threads=1
